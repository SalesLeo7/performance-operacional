<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../assets/favicon.png?v=2">
  <title>Protótipo · Contagem cíclica</title>
  <!-- Três variantes da análise de posições auditadas, alternáveis por ?variant=A|B|C. -->
  <style>
    :root{--navy:#002664;--blue:#07579f;--sky:#7db7d6;--green:#24843b;--amber:#d97706;--red:#c92a32;--ink:#172033;--muted:#667085;--line:#dbe3ec;--soft:#f3f6fa;--surface:#fff;--shadow:0 10px 28px rgba(0,38,100,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #8cc8e8;outline-offset:2px}
    .flag{position:fixed;right:18px;top:84px;z-index:10;padding:7px 10px;border:1px solid #f0c36b;border-radius:999px;background:#fff8df;color:#704800;font-size:10px;font-weight:800;letter-spacing:.08em}.top{height:74px;display:flex;align-items:center;gap:34px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center;color:var(--navy)}.brand-logo{width:84px;height:auto;max-height:40px;object-fit:contain;object-position:left center}.mark{width:33px;height:8px;background:#d71920;transform:skew(-20deg)}.brand b{display:block;font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.tabs{display:flex;align-self:stretch;gap:4px}.tabs span{display:flex;align-items:center;padding:0 13px;font-size:12px;color:#475467}.tabs .active{color:var(--navy);font-weight:750;border-bottom:3px solid #d71920}.fresh{margin-left:auto;font-size:11px;color:var(--muted)}.fresh b{display:block;color:var(--ink)}
    .shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 74px)}.side{background:#fff;border-right:1px solid var(--line);padding:26px 18px}.kicker{font-size:10px;font-weight:800;letter-spacing:.13em;color:#52627a}.field{display:block;margin-top:21px}.field span{display:block;margin-bottom:7px;font-size:11px;font-weight:700}.field select{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 9px;color:var(--ink)}.context{margin-top:20px;padding:13px;border:1px solid var(--line);border-radius:9px;background:#f8fafc}.context small,.context b,.context span{display:block}.context small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.context b{margin-top:6px;font-size:13px}.context span{margin-top:7px;color:var(--muted);font-size:10px;line-height:1.45}
    main{min-width:0;padding:28px 30px 110px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.head h1{margin:5px 0 4px;font-size:26px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted);font-size:12px}.asof{padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:10px;color:#475467;white-space:nowrap}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:19px}.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.panel-head h2{margin:0;font-size:15px}.panel-head span{font-size:10px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:15px}.kpi{min-height:108px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:10px;border-top:4px solid #cbd5e1}.kpi.blue{border-top-color:var(--blue)}.kpi.amber{border-top-color:var(--amber)}.kpi.green{border-top-color:var(--green)}.kpi.red{border-top-color:var(--red)}.kpi small{display:block;color:#475467;font-size:10px}.kpi b{display:block;margin:10px 0 5px;font-size:25px}.kpi span{display:block;color:var(--muted);font-size:9px;line-height:1.35}
    .legend{display:flex;gap:16px;margin-top:13px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.new{background:var(--blue)}.repeat{background:#aeb8c5}.line{background:var(--navy)}.bar-chart{height:290px;display:flex;align-items:flex-end;gap:20px;padding:26px 12px 0;border-bottom:1px solid #cfd8e2;margin-top:18px}.bar-group{height:100%;flex:1;min-width:70px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.bar-total{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end}.bar-seg{width:min(72px,80%);margin:0 auto}.bar-seg.new{background:var(--blue);border-radius:6px 6px 0 0}.bar-seg.repeat{background:#aeb8c5}.bar-label{margin-top:9px;color:#475467;font-size:10px;font-weight:700}.bar-note{position:absolute;top:0;color:var(--muted);font-size:9px}.cum-line{position:absolute;inset:25px 12px 32px;pointer-events:none}.cum-line svg{width:100%;height:100%;overflow:visible}.cum-line polyline{fill:none;stroke:var(--navy);stroke-width:3}.cum-line circle{fill:#fff;stroke:var(--navy);stroke-width:2}.value-tags{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:9px}.value-tags b{color:var(--navy)}
    .grid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px;margin-top:15px}.callout{padding:14px;border-radius:9px;background:#f7fbff;border:1px solid #cfe3f1;color:#344054;font-size:11px;line-height:1.5}.callout b{color:var(--navy)}.table{margin-top:15px;overflow:auto;border:1px solid var(--line);border-radius:9px}.table table{width:100%;border-collapse:collapse;min-width:650px;font-size:10px}.table th{padding:10px;text-align:left;background:#f4f7fa;color:#475467}.table td{padding:10px;border-top:1px solid #edf0f3}.table td b,.table td small{display:block}.table td small{margin-top:3px;color:var(--muted);font-size:9px}
    /* Variant B */
    .b-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.heatmap{display:grid;grid-template-columns:80px repeat(5,1fr);gap:5px;margin-top:18px;align-items:center}.heatmap span{font-size:9px;color:var(--muted)}.heatmap .day{text-align:center;font-weight:750}.cell{height:43px;border-radius:6px;background:#edf2f6;display:grid;place-items:center;color:#52627a;font-size:10px;font-weight:750}.l1{background:#d7ebf5}.l2{background:#a9d2e6}.l3{background:#6eafd0;color:#fff}.l4{background:var(--blue);color:#fff}.b-progress{display:flex;align-items:flex-end;gap:11px;height:240px;padding:20px 12px 0;border-bottom:1px solid #ccd6e1}.b-month{flex:1;text-align:center}.b-month div{height:180px;display:flex;align-items:flex-end;justify-content:center}.b-month i{width:42px;border-radius:6px 6px 0 0;background:var(--blue);display:block}.b-month b{display:block;margin-top:8px;font-size:10px}.b-month small{display:block;margin-top:4px;color:var(--muted);font-size:9px}.metric-list{display:grid;gap:10px;margin-top:18px}.metric-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:11px}.metric-row:last-child{border-bottom:0}.metric-row span{color:var(--muted)}.metric-row b{color:var(--navy)}
    /* Variant C */
    .c-hero{display:grid;grid-template-columns:1fr auto;gap:20px;padding:23px;border-radius:13px;background:var(--navy);color:#fff;box-shadow:var(--shadow)}.c-hero h2{margin:7px 0 5px;font-size:21px}.c-hero p{margin:0;max-width:600px;color:#c9dced;font-size:11px;line-height:1.5}.c-hero .big{font-size:42px;font-weight:800;text-align:right}.c-hero small{display:block;color:#c9dced;text-align:right;font-size:9px}.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.rank{display:grid;gap:9px;margin-top:18px}.rank-row{display:grid;grid-template-columns:25px 1fr 70px;gap:8px;align-items:center;font-size:10px}.rank-row>span:first-child{color:var(--muted);font-weight:800}.rank-row b{text-align:right}.rank-bar{height:8px;border-radius:99px;background:#edf1f5;overflow:hidden}.rank-bar i{display:block;height:100%;background:var(--red);border-radius:99px}.timeline{position:relative;margin-top:21px;padding-left:22px}.timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;border-left:2px solid #d7e1ea}.event{position:relative;padding:0 0 18px 13px}.event:before{content:"";position:absolute;left:-21px;top:1px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #e5f1f8}.event b{font-size:11px}.event span{display:block;margin-top:3px;color:var(--muted);font-size:10px}
    .switcher{position:fixed;left:50%;bottom:17px;z-index:20;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;background:#101828;color:#fff;box-shadow:0 16px 38px rgba(0,0,0,.25)}.switcher button{width:35px;height:35px;border:0;border-radius:50%;background:#344054;color:#fff;font-size:18px}.switcher b{min-width:280px;text-align:center;font-size:11px}.switcher small{display:block;margin-top:2px;color:#98a2b3;font-weight:400}
    @media(max-width:1050px){.shell{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:repeat(3,1fr)}.grid,.b-layout,.c-grid{grid-template-columns:1fr}.top{padding:0 16px}.tabs{margin-left:auto}.fresh{display:none}}
    @media(max-width:620px){main{padding:22px 14px 100px}.head{display:block}.asof{display:inline-block;margin-top:12px}.kpis{grid-template-columns:1fr 1fr}.bar-chart{gap:8px}.bar-group{min-width:50px}.switcher b{min-width:190px}.switcher small{display:none}.c-hero{grid-template-columns:1fr}.c-hero .big,.c-hero small{text-align:left}.heatmap{grid-template-columns:55px repeat(5,1fr)}.tabs span:not(.active){display:none}}
  </style>
</head>
<body>
  <div class="flag">PROTÓTIPO · CONTAGEM CÍCLICA</div>
  <header class="top"><div class="brand"><img class="brand-logo" src="../assets/dsv-logo.png" alt="DSV"><div><b>PERFORMANCE</b><small>Operações CJM</small></div></div><nav class="tabs"><span>Resumo</span><span>Recebimento</span><span>Expedição</span><span class="active">Inventário</span></nav><div class="fresh"><b>Dados atualizados</b><span>Base de contagens parciais</span></div></header>
  <div class="shell"><aside class="side"><span class="kicker">CONTEXTO</span><label class="field"><span>Cliente</span><select id="client"><option value="GWM">GWM</option><option value="ALL">Todos os clientes</option></select></label><label class="field"><span>Visualização</span><select id="level"><option value="month">Mês</option><option value="week">Semana</option><option value="day">Dia</option></select></label><div class="context"><small>Posição em</small><b>21/09/2026</b><span>A posição usa a última contagem conhecida por localização, tag e SKU.</span></div></aside><main id="app"></main></div>
  <div class="switcher"><button id="prev" aria-label="Variante anterior">‹</button><b id="variantName">A · Barras + acumulado<small>ritmo de auditoria e alcance</small></b><button id="next" aria-label="Próxima variante">›</button></div>
  <script>
    const DATA={GWM:{label:'GWM',months:[['Jun/26',28,0,28],['Jul/26',1166,38,1194],['Ago/26',214,21,1408],['Set/26',702,11,2110]],events:2180,positions:2110,revisited:70,repeatEvents:140,top:[['B05-023-110',24],['B05-025-110',18],['B04-018-101',15],['B03-007-210',12],['B01-001-102',9]]},ALL:{label:'Todos os clientes',months:[['Jun/26',247,0,247],['Jul/26',3626,824,3873],['Ago/26',1145,5061,5018],['Set/26',1767,4372,6785]],events:17042,positions:6785,revisited:2932,repeatEvents:13189,top:[['B05-023-110',312],['CO-PALLET-09',276],['B01-001-102',194],['B04-018-101',161],['B03-007-210',133]]}};
    const NAMES={A:['A · Barras + acumulado','ritmo de auditoria e alcance'],B:['B · Heatmap de atividade','concentração por período'],C:['C · Foco em cobertura','resultado e retrabalho']};
    const params=new URLSearchParams(location.search);let variant=(params.get('variant')||'A').toUpperCase();if(!NAMES[variant])variant='A';
    const selected=()=>DATA[document.getElementById('client').value];
    function baseHead(d){return `<div class="head"><div><span class="eyebrow">${d.label} · INVENTÁRIO</span><h1>Contagem cíclica</h1><p>Posições auditadas, alcance acumulado e reincidência de contagens.</p></div><div class="asof">Última contagem: <b>21/09/2026</b></div></div>`}
    function kpis(d){return `<section class="kpis"><article class="kpi blue"><small>Posições únicas auditadas</small><b>${d.positions.toLocaleString('pt-BR')}</b><span>ao menos uma auditoria no período</span></article><article class="kpi"><small>Auditorias realizadas</small><b>${d.events.toLocaleString('pt-BR')}</b><span>eventos posição + lista + data</span></article><article class="kpi green"><small>Reauditorias</small><b>${d.revisited.toLocaleString('pt-BR')}</b><span>posições que voltaram a ser auditadas</span></article><article class="kpi amber"><small>Eventos repetidos</small><b>${d.repeatEvents.toLocaleString('pt-BR')}</b><span>${(d.repeatEvents/d.events*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% dos eventos</span></article><article class="kpi red"><small>Unidade do indicador</small><b>Posição</b><span>não confundir com linhas de SKU</span></article></section>`}
    function variantA(d){const max=Math.max(...d.months.map(x=>x[1]+x[2]));const pts=d.months.map((x,i)=>{const x0=8+i*28;const y=100-(x[3]/d.positions*82);return `${x0},${y}`}).join(' ');return `${baseHead(d)}${kpis(d)}<section class="panel"><div class="panel-head"><h2>Ritmo de auditoria e posições alcançadas</h2><span>Barra = eventos · linha = posições únicas acumuladas</span></div><div class="bar-chart">${d.months.map(x=>`<div class="bar-group"><span class="bar-note">${(x[1]+x[2]).toLocaleString('pt-BR')}</span><div class="bar-total"><i class="bar-seg repeat" style="height:${x[2]/max*220}px"></i><i class="bar-seg new" style="height:${x[1]/max*220}px"></i></div><span class="bar-label">${x[0]}</span></div>`).join('')}<div class="cum-line"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}"/>${d.months.map((x,i)=>`<circle cx="${8+i*28}" cy="${100-(x[3]/d.positions*82)}" r="1.5"/>`).join('')}</svg></div></div><div class="legend"><span><i class="new"></i>Novas posições</span><span><i class="repeat"></i>Reauditorias</span><span><i class="line"></i>Acumulado de posições únicas</span></div></section><div class="grid"><article class="panel"><div class="panel-head"><h2>Como interpretar</h2><span>Leitura recomendada</span></div><div class="callout"><b>Este é o melhor formato para a visão executiva.</b><br>Mostra o esforço realizado em cada período e, ao mesmo tempo, quantas posições diferentes já foram alcançadas. A linha evita que um pico de reauditorias pareça crescimento de cobertura.</div></article><article class="panel"><div class="panel-head"><h2>Alcance no período</h2><span>Sem universo total informado</span></div><div class="metric-list"><div class="metric-row"><span>Eventos de auditoria</span><b>${d.events.toLocaleString('pt-BR')}</b></div><div class="metric-row"><span>Posições únicas</span><b>${d.positions.toLocaleString('pt-BR')}</b></div><div class="metric-row"><span>Reauditorias</span><b>${d.revisited.toLocaleString('pt-BR')}</b></div><div class="metric-row"><span>Denominador de cobertura</span><b>Não informado</b></div></div></article></div>`}
    function variantB(d){return `${baseHead(d)}${kpis(d)}<div class="b-layout"><section class="panel"><div class="panel-head"><h2>Mapa de atividade de auditoria</h2><span>Intensidade por mês e dia da semana</span></div><div class="heatmap"><span></span>${['Seg','Ter','Qua','Qui','Sex'].map(x=>`<span class="day">${x}</span>`).join('')}${d.months.map((m,i)=>`<span>${m[0]}</span>${[0,1,2,3,4].map(j=>`<i class="cell l${Math.min(4,1+((m[1]+m[2]+j*37+i*19)%4))}">${Math.round((m[1]+m[2])/(5-j*.6)).toLocaleString('pt-BR')}</i>`).join('')}`).join('')}</div><div class="legend"><span><i class="new"></i>Menor volume</span><span><i class="line"></i>Maior volume</span></div></section><section class="panel"><div class="panel-head"><h2>Posições únicas por mês</h2><span>Acumulado visual</span></div><div class="b-progress">${d.months.map(x=>`<div class="b-month"><div><i style="height:${x[3]/d.positions*180}px"></i></div><b>${x[3].toLocaleString('pt-BR')}</b><small>${x[0]}</small></div>`).join('')}</div><div class="callout" style="margin-top:15px"><b>Este formato ajuda a localizar concentração operacional.</b><br>É útil quando a pergunta é “em quais dias a equipe auditou mais?”, mas exige tooltip para explicar novas posições versus reauditorias.</div></section></div><section class="panel" style="margin-top:15px"><div class="panel-head"><h2>Detalhamento recomendado ao clicar em um mês</h2><span>próximo nível: semana → dia → lista</span></div><div class="table"><table><thead><tr><th>Período</th><th>Eventos</th><th>Novas posições</th><th>Reauditorias</th><th>Acumulado</th></tr></thead><tbody>${d.months.map(x=>`<tr><td><b>${x[0]}</b></td><td>${(x[1]+x[2]).toLocaleString('pt-BR')}</td><td>${x[1].toLocaleString('pt-BR')}</td><td>${x[2].toLocaleString('pt-BR')}</td><td>${x[3].toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table></div></section>`}
    function variantC(d){const max=d.top[0][1];return `${baseHead(d)}<section class="c-hero"><div><span class="eyebrow" style="color:#9dd4ef">FOCO DA OPERAÇÃO</span><h2>O que foi auditado e onde há retrabalho</h2><p>Use esta visão quando a prioridade for decidir quais posições precisam de ação, depois de medir o ritmo da contagem.</p></div><div><div class="big">${d.positions.toLocaleString('pt-BR')}</div><small>posições únicas alcançadas</small></div></section><div class="c-grid"><article class="panel"><div class="panel-head"><h2>Locais mais revisitados</h2><span>posição física</span></div><div class="rank">${d.top.map((x,i)=>`<div class="rank-row"><span>${String(i+1).padStart(2,'0')}</span><div><b>${x[0]}</b><div class="rank-bar"><i style="width:${x[1]/max*100}%"></i></div></div><b>${x[1]} auditorias</b></div>`).join('')}</div><div class="callout" style="margin-top:20px"><b>Este formato prioriza a ação.</b><br>Ele deixa o volume de auditoria em segundo plano e destaca locais que podem indicar divergência ou retrabalho.</div></article><article class="panel"><div class="panel-head"><h2>Jornada de uma posição</h2><span>exemplo de leitura</span></div><div class="timeline"><div class="event"><b>Primeira contagem</b><span>Posição entra no universo observado.</span></div><div class="event"><b>Recontagem</b><span>A mesma posição aparece em uma nova lista.</span></div><div class="event"><b>Conferência da divergência</b><span>Found, Lost ou OK orientam a ação.</span></div><div class="event"><b>Próxima ação</b><span>Detalhar SKU, tag e diferença.</span></div></div></article></div><section class="panel" style="margin-top:15px"><div class="panel-head"><h2>Quando usar esta variante</h2><span>visão operacional</span></div><div class="callout"><b>Escolha C se o cliente precisa agir sobre exceções.</b> Ela é menos adequada para acompanhar produtividade diária, mas melhor para priorizar locais com muitas revisitas.</div></section>`}
    function render(){const d=selected();document.getElementById('app').innerHTML=variant==='A'?variantA(d):variant==='B'?variantB(d):variantC(d);document.getElementById('variantName').innerHTML=`${NAMES[variant][0]}<small>${NAMES[variant][1]}</small>`;document.title=`${NAMES[variant][0]} · Contagem cíclica`}
    function setVariant(next){variant=next;history.replaceState(null,'',`?variant=${variant}`);render()}
    document.getElementById('client').addEventListener('change',render);document.getElementById('level').addEventListener('change',()=>{document.getElementById('level').value='month';render()});document.getElementById('prev').addEventListener('click',()=>setVariant(variant==='A'?'C':variant==='B'?'A':'B'));document.getElementById('next').addEventListener('click',()=>setVariant(variant==='A'?'B':variant==='B'?'C':'A'));document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')setVariant(variant==='A'?'C':variant==='B'?'A':'B');if(e.key==='ArrowRight')setVariant(variant==='A'?'B':variant==='B'?'C':'A')});render();
  </script>
</body>
</html>
