<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="../assets/favicon.png?v=2">
  <title>PROTÓTIPO — Performance Gross e NET</title>
  <!-- Três variantes da página de Expedição, alternáveis por ?variant=A|B|C. Protótipo descartável. -->
  <style>
    :root{--navy:#002664;--blue:#07579f;--sky:#8cc8e8;--red:#d71920;--amber:#ed8b00;--green:#26863b;--ink:#172033;--muted:#667085;--line:#dce2ea;--soft:#f3f6f9;--white:#fff;--shadow:0 14px 34px rgba(0,38,100,.11)}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink)}button,select{font:inherit}.flag{position:fixed;right:18px;top:12px;z-index:50;padding:7px 12px;border:1px solid #e4c35b;border-radius:99px;background:#fff4ce;color:#654c00;font-size:11px;font-weight:800}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:24px}.brand{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:800}.mark{width:34px;height:8px;background:var(--red);transform:skew(-22deg)}.tabs{display:flex;height:100%;gap:4px}.tabs span{display:flex;align-items:center;padding:0 14px;color:#667085;font-size:13px}.tabs .active{color:var(--navy);border-bottom:3px solid var(--red);font-weight:700}.stamp{margin-left:auto;color:var(--muted);font-size:11px}.switcher{position:fixed;z-index:60;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:99px;background:#101828;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.28)}.switcher button{width:36px;height:36px;border:0;border-radius:50%;background:#344054;color:#fff;font-size:20px;cursor:pointer}.switcher b{min-width:260px;text-align:center;font-size:13px}.switcher small{display:block;color:#98a2b3;font-weight:400}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 74px)}.side{background:#fff;border-right:1px solid var(--line);padding:24px 18px}.side h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 22px}.field{display:block;margin-bottom:17px}.field span{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field select{width:100%;height:41px;border:1px solid #cbd3df;border-radius:7px;background:#fff;padding:0 10px}.context{margin-top:20px;padding:14px;border-radius:9px;background:#f7f9fc;border:1px solid #e7ebf1}.context small,.context b{display:block}.context small{color:var(--muted);font-size:10px}.context b{margin-top:6px;font-size:13px}main{padding:24px 28px 90px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--blue)}h1{margin:5px 0 3px;font-size:26px}.head p{margin:0;color:var(--muted);font-size:13px}.pill{display:inline-flex;padding:6px 10px;border-radius:99px;background:#fde8e8;color:#a51016;font-size:11px;font-weight:800}.panel{background:#fff;border:1px solid #e1e6ed;border-radius:12px;padding:19px;box-shadow:0 1px 2px rgba(16,24,40,.03)}.panel h2{font-size:15px;margin:0}.muted{color:var(--muted);font-size:11px}.value{font-size:36px;font-weight:800;letter-spacing:-.04em}.good{color:var(--green)}.danger{color:var(--red)}.neutral{color:#98a2b3}.note{padding:12px 14px;background:#fff7e6;border:1px solid #f3d38d;border-radius:8px;color:#754800;font-size:11px;line-height:1.45}.track{height:10px;background:#edf1f5;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue)}.fill.net{background:var(--green)}
    .a-kpis{display:grid;grid-template-columns:1fr 1fr .72fr .72fr;gap:14px}.a-score{min-height:165px;position:relative;overflow:hidden}.a-score:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--blue)}.a-score.net:before{background:#98a2b3}.a-score .value{margin:20px 0 8px}.a-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.months{display:grid;gap:17px;margin-top:20px}.month{display:grid;grid-template-columns:62px 1fr 54px;gap:10px;align-items:center;font-size:11px}.month strong{text-align:right}.summary-list{display:grid;gap:11px;margin-top:16px}.summary-row{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #edf0f4;font-size:12px}
    .b-flow{display:grid;grid-template-columns:1fr 70px 1fr 70px 1fr;gap:14px;align-items:stretch}.b-step{min-height:250px;display:flex;flex-direction:column}.b-step .number{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em}.b-step .value{margin:24px 0 5px}.arrow{display:grid;place-items:center;font-size:34px;color:#98a2b3}.formula{margin-top:auto;padding:12px;background:#f7f9fc;border-radius:8px;font-size:11px;color:#475467}.b-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.capacity-bar{height:30px;border-radius:6px;background:#e9eef4;position:relative;margin:22px 0 10px}.capacity-bar span{display:block;width:100%;height:100%;background:var(--blue);border-radius:6px}.capacity-marker{position:absolute;right:4%;top:-8px;height:46px;border-left:3px solid var(--red)}
    .c-layout{display:grid;grid-template-columns:360px 1fr;gap:14px}.c-summary{background:var(--navy);color:#fff;border-radius:14px;padding:24px;min-height:470px;display:flex;flex-direction:column}.c-summary .muted{color:#c6d6e8}.c-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.c-metric{padding:16px;border-radius:10px;background:rgba(255,255,255,.1)}.c-metric .value{font-size:30px}.c-summary .note{margin-top:auto;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}.table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}.table th{text-align:left;padding:10px;background:#f7f9fc;color:#667085}.table td{padding:13px 10px;border-bottom:1px solid #edf0f4}.status{font-size:10px;font-weight:800;padding:5px 8px;border-radius:99px;background:#fde8e8;color:#a51016}.status.wait{background:#eef1f5;color:#667085}
    @media(max-width:1050px){.shell{grid-template-columns:1fr}.side{display:none}.a-kpis{grid-template-columns:1fr 1fr}.a-grid,.c-layout,.b-bottom{grid-template-columns:1fr}.b-flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
  </style>
</head>
<body>
  <div class="flag">PROTÓTIPO DESCARTÁVEL · GWM</div>
  <header class="top"><div class="brand"><span class="mark"></span><span>PERFORMANCE<br><small>Operações CJM</small></span></div><nav class="tabs"><span>Resumo</span><span>Recebimento</span><span class="active">Expedição</span><span>Detalhes</span></nav><div class="stamp">Dados agregados do dashboard local<br>jun./26 a ago./26</div></header>
  <div class="shell"><aside class="side"><h3>CONTEXTO</h3><label class="field"><span>Cliente</span><select><option>GWM · GWM</option></select></label><label class="field"><span>Owner</span><select><option>Todos os owners</option></select></label><label class="field"><span>Janela de análise</span><select><option>Últimos 3 meses</option></select></label><div class="context"><small>PERÍODO EXIBIDO</small><b>jun./26 a ago./26</b></div></aside><main id="app"></main></div>
  <div class="switcher"><button id="prev" aria-label="Anterior">←</button><b id="label"></b><button id="next" aria-label="Próxima">→</button></div>
  <script>
    const variants={A:'Comparação executiva',B:'Fluxo Gross → NET',C:'Mesa operacional'};
    let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
    if(!variants[variant])variant='A';
    const months=[['jun./26','56,6%',56.6],['jul./26','73,6%',73.6],['ago./26','78,3%',78.3]];
    const header=()=>`<div class="head"><div><span class="eyebrow">GWM · EXPEDIÇÃO</span><h1>Performance Gross e Performance NET</h1><p>Leitura do resultado antes e depois da aplicação da capacidade diária.</p></div><span class="pill">Gross abaixo da meta</span></div>`;
    const monthRows=()=>months.map(m=>`<div class="month"><b>${m[0]}</b><div class="track"><div class="fill" style="width:${m[2]}%"></div></div><strong>${m[1]}</strong></div>`).join('');
    function A(){return header()+`<section class="a-kpis"><article class="panel a-score"><h2>Performance Gross</h2><div class="value danger">72,5%</div><div class="muted">24.594 de 33.921 linhas no prazo</div></article><article class="panel a-score net"><h2>Performance NET</h2><div class="value neutral">—</div><div class="muted">Aguardando capacidade oficial ativa</div></article><article class="panel"><h2>Linhas avaliadas</h2><div class="value">33.921</div><div class="muted">pedidos concluídos ou vencidos</div></article><article class="panel"><h2>Linhas em atraso</h2><div class="value danger">9.327</div><div class="muted">27,5% do volume</div></article></section><section class="a-grid"><article class="panel"><h2>Evolução da Performance Gross</h2><div class="months">${monthRows()}</div></article><article class="panel"><h2>Leitura executiva</h2><div class="summary-list"><div class="summary-row"><span>Performance Gross</span><b>72,5%</b></div><div class="summary-row"><span>Performance NET</span><b>Não calculada</b></div><div class="summary-row"><span>Capacidade sugerida</span><b>468 linhas/dia</b></div></div><div class="note" style="margin-top:16px">Ative a capacidade oficial para calcular e comparar a Performance NET.</div></article></section>`}
    function B(){return header()+`<section class="b-flow"><article class="panel b-step"><span class="number">ETAPA 1</span><h2>Performance Gross</h2><div class="value danger">72,5%</div><p class="muted">Resultado de todas as linhas elegíveis, antes do limite de capacidade.</p><div class="formula">24.594 linhas no prazo ÷ 33.921 linhas avaliadas</div></article><div class="arrow">→</div><article class="panel b-step"><span class="number">ETAPA 2</span><h2>Aplicar capacidade</h2><div class="value">—</div><p class="muted">A capacidade sugerida é 468 linhas por dia, mas ainda não foi validada como oficial.</p><div class="formula">Linhas acima da capacidade deixam o NET e permanecem no Gross.</div></article><div class="arrow">→</div><article class="panel b-step"><span class="number">ETAPA 3</span><h2>Performance NET</h2><div class="value neutral">—</div><p class="muted">O resultado será exibido quando houver uma capacidade oficial ativa.</p><div class="formula">Linhas no prazo dentro da capacidade ÷ linhas elegíveis dentro da capacidade</div></article></section><section class="b-bottom"><article class="panel"><h2>Demanda diária e referência</h2><div class="capacity-bar"><span></span><i class="capacity-marker"></i></div><div class="muted">A linha vermelha representa a capacidade sugerida de 468 linhas/dia.</div></article><div class="note">Esta opção prioriza a explicação do cálculo. Ela reduz a chance de o cliente interpretar Gross e NET como dois SLAs independentes.</div></section>`}
    function C(){return header()+`<section class="c-layout"><article class="c-summary"><span class="eyebrow" style="color:#8cc8e8">RESULTADO DO PERÍODO</span><h2 style="font-size:21px;margin:8px 0">Expedição GWM</h2><div class="c-pair"><div class="c-metric"><span class="muted">Performance Gross</span><div class="value">72,5%</div></div><div class="c-metric"><span class="muted">Performance NET</span><div class="value">—</div></div></div><div class="c-pair"><div><span class="muted">No prazo</span><h2>24.594</h2></div><div><span class="muted">Em atraso</span><h2>9.327</h2></div></div><div class="note">NET indisponível: falta capacidade oficial ativa para o período.</div></article><article class="panel"><h2>Visão mensal para acompanhamento</h2><table class="table"><thead><tr><th>Mês</th><th>Performance Gross</th><th>Performance NET</th><th>Capacidade</th><th>Situação</th></tr></thead><tbody><tr><td>jun./26</td><td><b>56,6%</b></td><td>—</td><td>Sugerida</td><td><span class="status wait">Aguardando</span></td></tr><tr><td>jul./26</td><td><b>73,6%</b></td><td>—</td><td>Sugerida</td><td><span class="status wait">Aguardando</span></td></tr><tr><td>ago./26</td><td><b>78,3%</b></td><td>—</td><td>Sugerida</td><td><span class="status">Gross crítico</span></td></tr></tbody></table><div class="note" style="margin-top:18px">Esta opção concentra os dados em uma tabela para reuniões operacionais e comparação rápida entre meses.</div></article></section>`}
    function render(){document.getElementById('app').innerHTML=variant==='A'?A():variant==='B'?B():C();document.getElementById('label').innerHTML=`${variant} · ${variants[variant]}<small>Use ← → ou os botões para comparar</small>`}
    function cycle(step){const keys=Object.keys(variants),i=keys.indexOf(variant);variant=keys[(i+step+keys.length)%keys.length];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
