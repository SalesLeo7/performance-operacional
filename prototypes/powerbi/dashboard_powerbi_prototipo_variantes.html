<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PROTÓTIPO — Performance de Clientes</title>
  <!-- Três variações do dashboard, alternáveis por ?variant=A|B|C. Código descartável para validar UI. -->
  <style>
    :root{
      --navy:#002664;--blue:#004b93;--sky:#8cc8e8;--pale:#dbeef7;--red:#d71920;
      --amber:#ed8b00;--green:#26863b;--ink:#162033;--muted:#667085;--line:#d9dee7;
      --soft:#f3f5f8;--white:#fff;--shadow:0 10px 30px rgba(20,36,66,.10);
    }
    *{box-sizing:border-box} body{margin:0;background:#dfe4ea;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
    button,select,input{font:inherit} button{cursor:pointer}
    .prototype-flag{position:fixed;z-index:99;top:10px;right:16px;background:#fff4ce;color:#5f4600;border:1px solid #e7c85d;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
    #app{width:min(100vw,1920px);min-height:100vh;margin:auto;background:var(--soft)}
    .switcher{position:fixed;z-index:100;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 10px;background:#101828;color:#fff;border-radius:999px;box-shadow:0 12px 35px rgba(0,0,0,.28)}
    .switcher button{width:36px;height:36px;border:0;border-radius:50%;background:#344054;color:#fff;font-size:20px}.switcher button:hover{background:#475467}
    .switcher span{min-width:230px;text-align:center;font-size:13px;font-weight:700}.switcher small{display:block;color:#98a2b3;font-weight:400}
    .topbar{height:76px;display:flex;align-items:center;gap:22px;padding:0 32px;background:#fff;border-bottom:1px solid var(--line)}
    .brand{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--navy)}.brand i{display:inline-block;width:32px;height:7px;background:var(--red);margin-right:10px;vertical-align:middle;transform:skew(-22deg)}
    .topbar h1{margin:0;font-size:20px;font-weight:600}.updated{margin-left:auto;color:var(--muted);font-size:12px}
    .page-tabs{display:flex;gap:4px;background:#eef1f5;border-radius:9px;padding:4px}
    .page-tabs button{border:0;background:transparent;padding:9px 14px;border-radius:7px;color:#475467;font-size:13px;font-weight:600}.page-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.12)}
    .filter-panel{background:#fff;border-right:1px solid var(--line);padding:24px 18px;min-width:228px}.filter-panel h3{margin:0 0 20px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
    .field{margin-bottom:18px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#344054}.field select,.field input{width:100%;height:42px;border:1px solid #cfd5df;border-radius:6px;background:#fff;padding:0 10px;color:#344054}
    .filter-note{margin-top:22px;padding:12px;border-radius:8px;background:#f8fafc;color:#667085;font-size:11px;line-height:1.5}.more-filter{width:100%;border:1px solid var(--navy);color:var(--navy);background:#fff;padding:10px;border-radius:6px;font-weight:700}
    .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.kpi{background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:15px 16px;min-height:96px}.kpi .label{font-size:13px;color:#475467}.kpi .value{font-size:28px;line-height:1.25;font-weight:750;color:#101828}.kpi .sub{font-size:11px;color:#667085}.kpi.danger{border-top:4px solid var(--red)}.kpi.warn{border-top:4px solid var(--amber)}.kpi.good{border-top:4px solid var(--green)}
    .panel{background:#fff;border:1px solid #e4e7ec;border-radius:9px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}.panel h2,.panel h3{margin:0}.panel-title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.panel-title h2{font-size:16px}.panel-title span{font-size:11px;color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.badge.red{color:#a10e14;background:#fde8e8}.badge.amber{color:#854d0e;background:#fff1cc}.badge.green{color:#176b2b;background:#e5f4e8}.badge.blue{color:var(--navy);background:#e6f1f8}
    .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    .trend{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:end;height:240px;padding:20px 24px 0;border-bottom:1px solid #cfd5df}.month{height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.month .pct{font-size:18px;font-weight:750;margin-bottom:8px}.bar{margin:auto;width:60%;min-height:4px;border-radius:6px 6px 0 0}.bar.grey{background:#c8ced8}.bar.sky{background:var(--sky)}.bar.navy{background:var(--navy)}.month .name{padding:10px 0;font-size:12px;font-weight:700}.target-line{position:absolute;left:24px;right:24px;top:38px;border-top:2px dashed var(--green)}
    .trend-wrap{position:relative}.target-label{position:absolute;right:28px;top:22px;font-size:10px;color:var(--green);font-weight:700}
    .stack{height:14px;border-radius:999px;overflow:hidden;background:#eef1f5;display:flex}.stack .ok{background:var(--green)}.stack .late{background:var(--red)}
    .op-row{display:grid;grid-template-columns:140px 95px 1fr 105px;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #eef0f3}.op-row:last-child{border-bottom:0}.op-name{font-weight:750}.op-value{font-size:24px;font-weight:800}.op-meta{font-size:11px;color:var(--muted);margin-top:4px}
    .insight{border-left:5px solid var(--red);background:#fff7f7;border-radius:6px;padding:15px 16px}.insight strong{display:block;margin-bottom:5px}.insight p{margin:0;color:#475467;font-size:13px;line-height:1.5}
    .table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#667085;background:#f8fafc;padding:11px;border-bottom:1px solid #dfe3e8}.table td{padding:12px 11px;border-bottom:1px solid #edf0f2}.table tr:hover td{background:#f9fbfd}
    .empty-page{display:grid;place-items:center;height:540px;text-align:center;color:#667085}.empty-page b{display:block;color:#344054;font-size:20px;margin-bottom:10px}
    /* Variant A — classic executive grid */
    .variant-a .body{display:grid;grid-template-columns:228px 1fr;min-height:calc(100vh - 76px)}.variant-a main{padding:22px 28px 90px;overflow:hidden}.variant-a .grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.variant-a .narrative{display:grid;gap:14px}.variant-a .hero-strip{background:linear-gradient(105deg,var(--navy),#064c91);color:#fff;border-radius:9px;padding:18px 22px;display:flex;align-items:center;gap:18px;margin-bottom:14px}.variant-a .hero-strip b{font-size:20px}.variant-a .hero-strip span{font-size:13px;color:#d5e6f7}.variant-a .hero-strip .hero-spacer{margin-left:auto}.variant-a .hero-strip button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:6px;padding:9px 12px}
    /* Variant B — meeting narrative */
    .variant-b{background:#f8fafc}.variant-b .topbar{background:var(--navy);color:#fff;border:0}.variant-b .brand{color:#fff}.variant-b .updated{color:#d0d9e8}.variant-b .page-tabs{background:rgba(255,255,255,.12)}.variant-b .page-tabs button{color:#d9e5f2}.variant-b .page-tabs button.active{background:#fff;color:var(--navy)}
    .variant-b .body{padding:26px 34px 90px}.variant-b .meeting-head{display:grid;grid-template-columns:320px 1fr 300px;gap:18px}.variant-b .hero-score{background:var(--navy);color:#fff;border-radius:16px;padding:28px;min-height:320px;display:flex;flex-direction:column}.variant-b .hero-score .score{font-size:74px;font-weight:800;letter-spacing:-4px;margin-top:28px}.variant-b .hero-score .score-label{color:#b9cae0}.variant-b .hero-score .goal{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.25);display:flex;justify-content:space-between}.variant-b .story{background:#fff;border-radius:16px;padding:26px;box-shadow:var(--shadow)}.variant-b .story h2{margin:0;font-size:24px}.variant-b .story-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.variant-b .story-month{border-radius:12px;padding:18px;background:#f4f6f9}.variant-b .story-month.current{background:#e8f1fa;border:2px solid var(--navy)}.variant-b .story-month .big{font-size:31px;font-weight:800}.variant-b .talking{background:#fff;border-radius:16px;padding:24px;border:1px solid #e4e7ec}.variant-b .talking h3{margin-top:0}.variant-b .talking li{margin:0 0 16px;padding-left:4px;color:#475467;font-size:13px;line-height:1.45}.variant-b .bottom-band{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.variant-b .metric-band{background:#fff;padding:18px 20px;border-left:5px solid var(--sky);border-radius:8px}.variant-b .metric-band b{font-size:25px}.variant-b .filters-inline{display:flex;gap:12px;margin-bottom:18px}.variant-b .filters-inline select{height:40px;border:1px solid #d0d5dd;border-radius:7px;padding:0 12px;background:#fff}
    /* Variant C — analytical split-screen */
    .variant-c{background:#edf1f5}.variant-c .body{display:grid;grid-template-columns:78px 1fr;min-height:calc(100vh - 76px)}.variant-c .rail{background:#101828;color:#fff;padding:20px 10px;display:flex;flex-direction:column;gap:14px;align-items:center}.variant-c .rail button{width:48px;height:48px;border:0;border-radius:12px;background:#25334a;color:#fff;font-weight:800}.variant-c .rail button.active{background:var(--red)}.variant-c main{padding:20px 24px 90px}.variant-c .control-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}.variant-c .control-row select{height:38px;border:1px solid #cdd4df;border-radius:6px;padding:0 12px;background:#fff}.variant-c .control-row .push{margin-left:auto}.variant-c .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.variant-c .op-card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #dce1e8}.variant-c .op-card header{padding:16px 18px;background:#f8fafc;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between}.variant-c .op-card .op-content{padding:18px}.variant-c .scoreline{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center}.variant-c .donut{width:126px;height:126px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--red) 0 69.18%,#e8ecf1 69.18%)}.variant-c .donut.out{background:conic-gradient(var(--amber) 0 94.7%,#e8ecf1 94.7%)}.variant-c .donut:after{content:"";width:86px;height:86px;border-radius:50%;background:#fff;position:absolute}.variant-c .donut b{z-index:1;font-size:24px}.variant-c .mini-month{display:grid;grid-template-columns:70px 1fr 55px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.variant-c .mini-track{height:10px;background:#edf0f4;border-radius:10px;overflow:hidden}.variant-c .mini-fill{height:100%;background:var(--navy)}.variant-c .exceptions{margin-top:14px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.variant-c .exception-list{display:grid;gap:8px}.variant-c .exception{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 12px;background:#f8fafc;border-radius:7px}.variant-c .exception small{display:block;color:#667085;margin-top:3px}
    .quality-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quality-card{background:#fff;border:1px solid #e4e7ec;border-radius:9px;padding:20px}.quality-card b{font-size:30px}.quality-card p{margin:5px 0 0;color:#667085;font-size:12px;line-height:1.5}
    @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.variant-a .grid,.variant-b .meeting-head,.variant-c .split{grid-template-columns:1fr}.variant-a .filter-panel{display:none}.variant-a .body{grid-template-columns:1fr}.variant-b .meeting-head{display:block}.variant-b .meeting-head>*{margin-bottom:14px}}
  </style>
</head>
<body>
  <div class="prototype-flag">PROTÓTIPO DESCARTÁVEL • dados reais agregados</div>
  <div id="app"></div>
  <div class="switcher" aria-label="Alternador de variações">
    <button id="prev" aria-label="Variação anterior">←</button>
    <span id="variantLabel"></span>
    <button id="next" aria-label="Próxima variação">→</button>
  </div>
  <script>
    const variants={A:'Grade executiva',B:'Narrativa de reunião',C:'Análise lado a lado'};
    const pages=['Resumo','Expedição','Recebimento','Detalhes','Qualidade'];
    let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
    if(!variants[variant]) variant='A';
    let page='Resumo';
    const data={
      outbound:[
        {month:'Mai',lines:12263,on:11173,late:1090,sla:91.11},
        {month:'Jun',lines:10170,on:6646,late:3524,sla:65.35},
        {month:'Jul',lines:13654,on:12930,late:724,sla:94.70}
      ],
      inbound:[
        {month:'Mai',lines:1406,on:719,late:687,sla:51.14},
        {month:'Jun',lines:2199,on:928,late:1271,sla:42.20},
        {month:'Jul',lines:2002,on:617,late:1385,sla:30.82}
      ]
    };
    const fmt=n=>new Intl.NumberFormat('pt-BR').format(n);
    const pct=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
    const current=op=>data[op][2];
    const delta=op=>current(op).sla-data[op][1].sla;
    function status(v){return v>=95?'good':v>=90?'warn':'danger'}
    function badge(v){const s=status(v),t=s==='good'?'Dentro da meta':s==='warn'?'Atenção':'Crítico';return `<span class="badge ${s==='danger'?'red':s==='warn'?'amber':'green'}"><i class="dot"></i>${t}</span>`}
    function tabs(){return `<div class="page-tabs">${pages.map(p=>`<button data-page="${p}" class="${page===p?'active':''}">${p}</button>`).join('')}</div>`}
    function header(dark=false){return `<header class="topbar"><div class="brand"><i></i>DSV</div><h1>Performance operacional • BRGWM</h1>${tabs()}<div class="updated">Dados até 31 jul 2026<br>Atualizado em 01 ago 2026</div></header>`}
    function filters(){return `<aside class="filter-panel"><h3>Filtros</h3><div class="field"><label>Cliente</label><select><option>GWM • BRGWM</option></select></div><div class="field"><label>Período</label><select><option>mai–jul 2026</option></select></div><div class="field"><label>Performance</label><select><option>Todos</option><option>On Time</option><option>Delay</option></select></div><button class="more-filter" data-more>Mais filtros</button><div class="filter-note">Relatório pré-filtrado para um cliente. Filtros sincronizados entre páginas.</div></aside>`}
    function kpis(op){const d=current(op),cov=op==='outbound'?99.23:99.97;return `<section class="kpis">
      <div class="kpi ${status(d.sla)}"><div class="label">SLA por linhas</div><div class="value">${pct(d.sla)}</div><div class="sub">${badge(d.sla)}</div></div>
      <div class="kpi"><div class="label">Meta SLA</div><div class="value">95,0%</div><div class="sub">Parâmetro vigente</div></div>
      <div class="kpi"><div class="label">Total de linhas</div><div class="value">${fmt(d.lines)}</div><div class="sub">jul/2026</div></div>
      <div class="kpi danger"><div class="label">Linhas em atraso</div><div class="value">${fmt(d.late)}</div><div class="sub">${pct(100*d.late/d.lines)} do volume</div></div>
      <div class="kpi ${delta(op)>=0?'good':'danger'}"><div class="label">Variação mensal</div><div class="value">${delta(op)>=0?'+':''}${pct(delta(op))}</div><div class="sub">vs. jun/2026</div></div>
      <div class="kpi good"><div class="label">Cobertura</div><div class="value">${pct(cov)}</div><div class="sub">registros elegíveis</div></div>
    </section>`}
    function trend(op){const arr=data[op];return `<div class="panel trend-wrap"><div class="panel-title"><h2>SLA por linhas • últimos três meses fechados</h2><span>Meta 95%</span></div><div class="target-line"></div><span class="target-label">META</span><div class="trend">${arr.map((d,i)=>`<div class="month"><div class="pct">${pct(d.sla)}</div><div class="bar ${i===0?'grey':i===1?'sky':'navy'}" style="height:${Math.max(8,d.sla*1.65)}px"></div><div class="name">${d.month}/26</div></div>`).join('')}</div></div>`}
    function operationRows(){const o=current('outbound'),i=current('inbound');return `<div class="panel"><div class="panel-title"><h2>Resultado por operação</h2><span>jul/2026</span></div>${[['Expedição',o],['Recebimento',i]].map(([n,d])=>`<div class="op-row"><div><div class="op-name">${n}</div><div class="op-meta">${fmt(d.lines)} linhas</div></div><div class="op-value">${pct(d.sla)}</div><div><div class="stack"><div class="ok" style="width:${d.sla}%"></div><div class="late" style="width:${100-d.sla}%"></div></div><div class="op-meta">${fmt(d.on)} no prazo • ${fmt(d.late)} em atraso</div></div>${badge(d.sla)}</div>`).join('')}</div>`}
    function insights(){return `<div class="narrative"><div class="insight"><strong>Recebimento requer plano de recuperação</strong><p>O SLA caiu pelo terceiro mês consecutivo e chegou a 30,8%. Foram 1.385 linhas em atraso em julho.</p></div><div class="insight" style="border-color:var(--amber);background:#fffaf0"><strong>Expedição voltou a se aproximar da meta</strong><p>O resultado avançou 29,3 p.p. versus junho, mas ainda ficou 0,3 p.p. abaixo da meta.</p></div><button class="more-filter" data-page="Detalhes">Abrir processos em atraso →</button></div>`}
    function detailTable(){return `<div class="panel"><div class="panel-title"><h2>Processos em atraso • amostra para validação visual</h2><span>Ordenado por linhas</span></div><table class="table"><thead><tr><th>Operação</th><th>Processo</th><th>Criação</th><th>Linhas</th><th>Tipo / Status</th><th>Performance</th></tr></thead><tbody>
      <tr><td>Recebimento</td><td>PA-08471</td><td>29/07/2026</td><td>184</td><td>Sea freight</td><td>${badge(30)}</td></tr>
      <tr><td>Expedição</td><td>ORD-239104</td><td>28/07/2026</td><td>126</td><td>STOCK</td><td>${badge(70)}</td></tr>
      <tr><td>Recebimento</td><td>PA-08388</td><td>26/07/2026</td><td>97</td><td>Air freight</td><td>${badge(30)}</td></tr>
      <tr><td>Expedição</td><td>ORD-238771</td><td>24/07/2026</td><td>63</td><td>RUSH</td><td>${badge(70)}</td></tr>
    </tbody></table><div class="filter-note">Identificadores ilustrativos. No Power BI, esta tabela será alimentada pelos registros reais e aberta por drill-through.</div></div>`}
    function quality(){return `<div><div class="quality-grid"><div class="quality-card"><span class="badge green">Expedição</span><br><b>99,23%</b><p>Cobertura observada para BRGWM. 122 registros sem classificação na base completa do cliente.</p></div><div class="quality-card"><span class="badge green">Recebimento</span><br><b>99,97%</b><p>Cobertura de linhas para BRGWM. Um registro sem quantidade de linhas.</p></div><div class="quality-card"><span class="badge amber">Regra ativa</span><br><b>BRBMW</b><p>Cliente excluído de Recebimento devido a datas de criação inválidas em todos os 1.562 registros.</p></div></div><div class="panel" style="margin-top:14px"><h2>Controles antes da publicação</h2><table class="table"><tbody><tr><td>Chaves únicas</td><td><span class="badge green">Aprovado</span></td><td>Chaveamento é único nos dois fatos</td></tr><tr><td>Datas de criação</td><td><span class="badge amber">Monitorar</span></td><td>Tipos mistos e valores inválidos exigem Power Query explícito</td></tr><tr><td>Geografia</td><td><span class="badge red">Fora do escopo</span></td><td>Baixa completude e problemas de codificação</td></tr></tbody></table></div></div>`}
    function contentForPage(op='outbound'){if(page==='Detalhes')return detailTable();if(page==='Qualidade')return quality();if(page==='Expedição')return `${kpis('outbound')}<div style="margin-top:14px">${trend('outbound')}</div>`;if(page==='Recebimento')return `${kpis('inbound')}<div style="margin-top:14px">${trend('inbound')}</div>`;return null}
    function renderA(){let body=contentForPage();if(!body)body=`<div class="hero-strip"><div><b>Resumo executivo • julho de 2026</b><br><span>Performance ponderada por linhas • meta contratual provisória de 95%</span></div><div class="hero-spacer"></div><button data-page="Detalhes">Ver detalhes</button></div>${kpis('outbound')}<div class="grid">${operationRows()}${insights()}</div>`;return `<div class="variant-a">${header()}<div class="body">${filters()}<main>${body}</main></div></div>`}
    function storyMonth(d,i){return `<div class="story-month ${i===2?'current':''}"><small>${d.month}/26</small><div class="big">${pct(d.sla)}</div><div class="op-meta">${fmt(d.late)} linhas atrasadas</div></div>`}
    function renderB(){if(page!=='Resumo'){return `<div class="variant-b">${header(true)}<div class="body"><div class="filters-inline"><select><option>GWM • BRGWM</option></select><select><option>mai–jul 2026</option></select></div>${contentForPage()}</div></div>`}
      const i=current('inbound');return `<div class="variant-b">${header(true)}<main class="body"><div class="filters-inline"><select><option>GWM • BRGWM</option></select><select><option>mai–jul 2026</option></select><button class="more-filter" style="width:auto" data-more>Mais filtros</button></div><section class="meeting-head"><div class="hero-score"><span class="score-label">SLA crítico da reunião</span><div class="score">${pct(i.sla)}</div><div>${badge(i.sla)}</div><div class="goal"><span>Recebimento</span><b>Meta 95%</b></div></div><div class="story"><h2>Recebimento perdeu desempenho por três meses</h2><p style="color:#667085">A leitura começa pelo desvio, percorre a evolução e termina nos processos que exigem ação.</p><div class="story-grid">${data.inbound.map(storyMonth).join('')}</div><button class="more-filter" style="margin-top:24px" data-page="Detalhes">Investigar 1.385 linhas em atraso →</button></div><aside class="talking"><h3>Pontos para a reunião</h3><ol><li>O volume permaneceu próximo de 2 mil linhas, mas o SLA caiu 11,4 p.p.</li><li>Expedição recuperou 29,3 p.p. e encerrou julho próxima da meta.</li><li>A cobertura dos dados é superior a 99% nas duas operações.</li></ol><span class="badge blue">Narrativa orientada a decisão</span></aside></section><section class="bottom-band"><div class="metric-band"><small>Expedição</small><br><b>94,7%</b><div class="op-meta">724 linhas em atraso</div></div><div class="metric-band" style="border-color:var(--red)"><small>Recebimento</small><br><b>30,8%</b><div class="op-meta">1.385 linhas em atraso</div></div><div class="metric-band" style="border-color:var(--green)"><small>Cobertura mínima</small><br><b>99,2%</b><div class="op-meta">base apta à apresentação</div></div></section></main></div>`}
    function miniMonths(op){return data[op].map(d=>`<div class="mini-month"><span>${d.month}/26</span><div class="mini-track"><div class="mini-fill" style="width:${d.sla}%"></div></div><b>${pct(d.sla)}</b></div>`).join('')}
    function opCard(title,op){const d=current(op);return `<article class="op-card"><header><b>${title}</b>${badge(d.sla)}</header><div class="op-content"><div class="scoreline"><div class="donut ${op==='outbound'?'out':''}"><b>${pct(d.sla)}</b></div><div><div class="op-meta">SLA por linhas • jul/26</div><h2 style="margin:5px 0">${fmt(d.lines)} linhas</h2><span style="color:var(--red);font-weight:700">${fmt(d.late)} em atraso</span></div></div><div style="margin-top:18px">${miniMonths(op)}</div></div></article>`}
    function renderC(){if(page!=='Resumo'){return `<div class="variant-c">${header()}<div class="body"><aside class="rail">${pages.map((p,i)=>`<button data-page="${p}" class="${page===p?'active':''}" title="${p}">${i+1}</button>`).join('')}</aside><main>${contentForPage()}</main></div></div>`}return `<div class="variant-c">${header()}<div class="body"><aside class="rail">${pages.map((p,i)=>`<button data-page="${p}" class="${page===p?'active':''}" title="${p}">${i+1}</button>`).join('')}</aside><main><div class="control-row"><b>Visão comparativa</b><select><option>GWM • BRGWM</option></select><select><option>mai–jul 2026</option></select><span class="push badge blue">Meta 95%</span></div><section class="split">${opCard('Expedição','outbound')}${opCard('Recebimento','inbound')}</section><section class="exceptions"><div class="panel"><div class="panel-title"><h2>Maiores exceções para discussão</h2><span>jul/2026</span></div><div class="exception-list"><div class="exception"><div><b>Recebimento • Sea freight</b><small>Concentração de linhas atrasadas</small></div><b style="color:var(--red)">1.385</b></div><div class="exception"><div><b>Expedição • abaixo da meta</b><small>Diferença residual de 0,3 p.p.</small></div><b style="color:var(--amber)">724</b></div></div></div><div class="panel"><h2 style="font-size:16px">Próxima ação</h2><p style="font-size:13px;color:#475467;line-height:1.5">Abrir o detalhe de Recebimento e revisar os processos com maior volume de linhas.</p><button class="more-filter" data-page="Detalhes">Abrir exceções →</button></div></section></main></div></div>`}
    function moreFilters(){return `<div class="panel"><h2>Mais filtros</h2><p style="color:#667085">Página oculta no Power BI. Clique no fundo para retornar.</p><div class="quality-grid" style="margin-top:20px"><div class="field"><label>Tipo de pedido</label><select><option>Todos</option><option>STOCK</option><option>RUSH</option></select></div><div class="field"><label>Status de recebimento</label><select><option>Todos</option><option>Complete</option><option>Air freight</option><option>Sea freight</option></select></div><div class="field"><label>Faixa de linhas</label><select><option>Todas</option><option>1–10</option><option>11–100</option><option>100+</option></select></div></div><button class="more-filter" id="backMore">← Voltar</button></div>`}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{document.querySelector('main').innerHTML=moreFilters();document.getElementById('backMore').onclick=render})}
    function render(){document.getElementById('app').innerHTML=variant==='A'?renderA():variant==='B'?renderB():renderC();document.getElementById('variantLabel').innerHTML=`${variant} • ${variants[variant]}<small>Use ← → ou os botões para comparar</small>`;bind()}
    function cycle(dir){const keys=Object.keys(variants),idx=keys.indexOf(variant);variant=keys[(idx+dir+keys.length)%keys.length];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);
    addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
    render();
  </script>
</body>
</html>
